<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keel</title>
<meta name="description" content="Money, work, habits, health and notes in one place — offline, private, yours.">
<meta name="theme-color" content="#101215">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keel">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Keel — one stylesheet. Dark by design: this is an app for late evenings
   and early mornings, and a phone screen at either end of the day. */

:root {
  color-scheme: dark;

  /* Surfaces */
  --bg: #101215;
  --surface: #191c21;
  --surface-2: #21252b;
  --surface-3: #2a2f37;
  --border: #2b3038;
  --border-strong: #3a414c;

  /* Ink */
  --text: #f2f4f7;
  --text-2: #a8b0bd;
  --text-3: #737d8c;

  /* Categorical series, fixed order, never cycled.
     Validated against the surface above for lightness, chroma,
     colour-vision separation and contrast. */
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;

  --accent: var(--series-1);
  --accent-soft: rgba(57, 135, 229, 0.16);
  --accent-line: rgba(57, 135, 229, 0.42);

  /* Status. Reserved: never reused as a series colour, always paired with
     a word or icon so meaning never rests on colour alone. */
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;

  --good-soft: rgba(12, 163, 12, 0.14);
  --warning-soft: rgba(250, 178, 25, 0.13);
  --critical-soft: rgba(208, 59, 59, 0.14);

  --radius: 14px;
  --radius-sm: 9px;
  --radius-lg: 20px;

  --tap: 44px;
  --gap: 12px;
  --pad: 16px;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.28);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, "Noto Sans", sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, sans-serif;

  --appbar-h: 52px;
  --tabbar-h: 60px;
}

* { box-sizing: border-box; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body.sheet-open { overflow: hidden; }

h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ------------------------------------------------------------- app bar */

.appbar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--appbar-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  padding-top: env(safe-area-inset-top);
  height: calc(var(--appbar-h) + env(safe-area-inset-top));
  background: rgba(16, 18, 21, 0.86);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.appbar-brand { display: flex; align-items: center; gap: 8px; padding-left: 4px; }

.appbar-mark {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  font-size: 15px;
}

.appbar-name { font-weight: 650; letter-spacing: -0.02em; }
.appbar-mid { flex: 1; text-align: center; }
.appbar-date { color: var(--text-3); font-size: 13px; }
.appbar-actions { display: flex; gap: 2px; }

/* --------------------------------------------------------------- layout */

.screen {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  padding: var(--gap) var(--pad);
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);
  max-width: 620px;
  margin: 0 auto;
}

.screen:focus { outline: none; }

/* ----------------------------------------------------------------- cards */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--pad);
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

.card.tone-accent {
  border-color: var(--accent-line);
  background: linear-gradient(160deg, var(--accent-soft), var(--surface) 62%);
}

.card.tone-warn { border-color: rgba(250, 178, 25, 0.34); }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.card-titles { min-width: 0; }
.card-title { font-size: 16px; }
.card-sub { color: var(--text-3); font-size: 13px; margin-top: 2px; }
.card-text { color: var(--text-2); font-size: 14.5px; }
.card-note { color: var(--text-3); font-size: 13px; }
.card-note-quiet { font-size: 12.5px; }
.card-note.tone-warning { color: var(--status-warning); }

.card-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  padding: 6px 2px;
  white-space: nowrap;
}

.section-head { display: flex; justify-content: space-between; align-items: center; }
.section-title { font-size: 15px; color: var(--text-2); }

.subhead {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 4px;
}

.empty {
  color: var(--text-3);
  font-size: 14px;
  padding: 6px 0 2px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
}

/* --------------------------------------------------------------- welcome */

.welcome-title { font-size: 20px; }
.welcome-text { color: var(--text-2); font-size: 14.5px; margin-top: 8px; }
.welcome-quiet { color: var(--text-3); font-size: 13px; }
.welcome-actions { margin-top: 12px; }

.greeting { padding: 4px 2px 0; }
.greeting-text { font-size: 26px; letter-spacing: -0.02em; }
.greeting-date { color: var(--text-3); font-size: 14px; margin-top: 2px; }

/* --------------------------------------------------------------- buttons */

.btn {
  min-height: var(--tap);
  padding: 0 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 120ms ease, transform 80ms ease;
}

.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text-2); }
.btn-danger { background: var(--status-critical); border-color: var(--status-critical); color: #fff; }
.btn-danger-ghost { background: transparent; border-color: transparent; color: var(--status-critical); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
.btn:disabled { opacity: 0.5; cursor: default; }

.icon-btn {
  width: var(--tap);
  height: var(--tap);
  display: grid;
  place-items: center;
  border: none;
  background: transparent;
  color: var(--text-2);
  border-radius: 10px;
  font-size: 19px;
  cursor: pointer;
}

.icon-btn:active { background: var(--surface-2); }

.button-row { display: flex; gap: 8px; flex-wrap: wrap; }
.button-row .btn { flex: 1 1 auto; }

/* ----------------------------------------------------------------- stats */

.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
  gap: 8px;
}

.stat {
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 10px 10px 9px;
  min-width: 0;
}

.stat-value {
  font-family: var(--font-num);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stat-unit { font-size: 13px; font-weight: 600; color: var(--text-3); margin-left: 1px; }
.stat-label { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.stat-note { font-size: 11px; color: var(--text-3); margin-top: 2px; opacity: 0.85; }

.stat.tone-good .stat-value { color: var(--status-good); }
.stat.tone-warning .stat-value { color: var(--status-warning); }
.stat.tone-critical .stat-value { color: var(--status-critical); }

/* ----------------------------------------------------------------- pills */

.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 650;
  background: var(--surface-3);
  color: var(--text-2);
  white-space: nowrap;
}

.pill.tone-good { background: var(--good-soft); color: var(--status-good); }
.pill.tone-warning { background: var(--warning-soft); color: var(--status-warning); }
.pill.tone-critical { background: var(--critical-soft); color: var(--status-critical); }
.pill.tone-info { background: var(--accent-soft); color: var(--accent); }
.pill.tone-muted { background: transparent; color: var(--text-3); border: 1px solid var(--border); }

/* -------------------------------------------------------------- progress */

.progress {
  height: 7px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}

.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.progress-fill.tone-good { background: var(--status-good); }
.progress-fill.tone-warning { background: var(--status-warning); }

/* ------------------------------------------------------------------ list */

.list { display: flex; flex-direction: column; }
.list.is-muted { opacity: 0.62; }

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  text-align: left;
  width: 100%;
  min-height: var(--tap);
}

.list > .row:last-child, .list > *:last-child .row { border-bottom: none; }
.row.is-muted { opacity: 0.55; }

.row-tappable {
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font: inherit;
  padding: 11px 0;
}

.row-tappable:active { background: var(--surface-2); }
.row-body { flex: 1; min-width: 0; }
.row-title { font-size: 15px; font-weight: 550; overflow-wrap: anywhere; }
.row-sub { font-size: 12.5px; color: var(--text-3); margin-top: 1px; }
.row-amount { font-family: var(--font-num); font-size: 15px; white-space: nowrap; }
.row-amount.tone-good { color: var(--status-good); }
.row-actions { display: flex; gap: 6px; }

/* ------------------------------------------------------------- check rows */

.check-row {
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  min-height: 50px;
}

.check-row:last-child { border-bottom: none; }

.check {
  width: 26px; height: 26px;
  flex: none;
  border-radius: 8px;
  border: 2px solid var(--border-strong);
  background: transparent;
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
  transition: background 120ms ease, border-color 120ms ease;
}

.check-lg { width: 30px; height: 30px; }

.check-row.is-done .check,
.check.is-done {
  background: var(--status-good);
  border-color: var(--status-good);
}

.check-body {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  text-align: left;
  padding: 12px 0;
  cursor: pointer;
  font: inherit;
}

.check-title { font-size: 15px; overflow-wrap: anywhere; }
.check-sub { font-size: 12.5px; color: var(--text-3); margin-top: 1px; }
.check-row.is-done .check-title { color: var(--text-3); text-decoration: line-through; }

/* ----------------------------------------------------------------- focus */

.focus-input { font-size: 15px; }

.focus-set { display: flex; align-items: center; gap: 12px; }
.focus-text { flex: 1; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.focus-set.is-done .focus-text { color: var(--text-3); text-decoration: line-through; }

/* -------------------------------------------------------------- insights */

.insights { display: flex; flex-direction: column; gap: 8px; }

.insight {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  padding: 12px 13px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  font: inherit;
}

.insight-mark {
  flex: none;
  width: 21px; height: 21px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 800;
  background: var(--surface-3);
  color: var(--text-2);
  margin-top: 1px;
}

.insight-title { font-size: 14.5px; font-weight: 650; }
.insight-detail { font-size: 13px; color: var(--text-2); margin-top: 3px; }

.insight.tone-urgent { border-color: rgba(208, 59, 59, 0.42); background: var(--critical-soft); }
.insight.tone-urgent .insight-mark { background: var(--status-critical); color: #fff; }
.insight.tone-warn { border-color: rgba(250, 178, 25, 0.34); background: var(--warning-soft); }
.insight.tone-warn .insight-mark { background: var(--status-warning); color: #101215; }
.insight.tone-good { border-color: rgba(12, 163, 12, 0.34); background: var(--good-soft); }
.insight.tone-good .insight-mark { background: var(--status-good); color: #fff; }
.insight.tone-info .insight-mark { background: var(--accent); color: #fff; }

.pattern { padding: 11px 0; border-bottom: 1px solid var(--border); }
.pattern:last-child { border-bottom: none; }
.pattern-title { font-size: 14.5px; font-weight: 650; }
.pattern-detail { font-size: 13px; color: var(--text-2); margin-top: 3px; }

/* ---------------------------------------------------------------- habits */

.habit-strip {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(96px, 1fr);
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  padding-bottom: 4px;
  margin: 0 calc(var(--pad) * -1);
  padding-left: var(--pad);
  padding-right: var(--pad);
  scrollbar-width: none;
}

.habit-strip::-webkit-scrollbar { display: none; }

.habit-tile {
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  padding: 12px 11px;
  min-height: 92px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  text-align: left;
}

.habit-tile.is-done { background: var(--good-soft); border-color: rgba(12, 163, 12, 0.4); }
.habit-tile.is-met { border-color: rgba(12, 163, 12, 0.28); }
.habit-emoji { font-size: 20px; line-height: 1; }
.habit-name {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.25;
  overflow-wrap: anywhere;
  hyphens: auto;
}
.habit-meta { font-size: 11px; color: var(--text-3); margin-top: auto; }

.habit-list { display: flex; flex-direction: column; gap: 4px; }

.habit-detail { padding: 10px 0; border-bottom: 1px solid var(--border); }
.habit-detail:last-child { border-bottom: none; }
.habit-detail-head { display: flex; align-items: center; gap: 12px; }

.habit-check {
  width: 40px; height: 40px;
  flex: none;
  border-radius: 12px;
  border: 2px solid var(--border-strong);
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 18px;
  cursor: pointer;
}

.habit-check.is-done {
  background: var(--status-good);
  border-color: var(--status-good);
  color: #fff;
  font-weight: 700;
}

.habit-detail-body {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  text-align: left;
  padding: 4px 0;
  cursor: pointer;
  font: inherit;
}

.habit-detail-name { font-size: 15px; font-weight: 600; }
.habit-detail-meta { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

.habit-week { display: flex; gap: 5px; margin-top: 9px; padding-left: 52px; }

.habit-day {
  flex: 1;
  height: 30px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-3);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.habit-day.is-done { background: var(--status-good); border-color: var(--status-good); color: #fff; }
.habit-day.is-today { border-color: var(--accent); }
.habit-day.is-future { opacity: 0.3; cursor: default; }

/* --------------------------------------------------------------- heatmap */

.heatmap { display: flex; flex-direction: column; gap: 6px; }
.heatmap-days { display: none; }

.heatmap-grid {
  display: flex;
  gap: 3px;
  overflow-x: auto;
  scrollbar-width: none;
}

.heatmap-grid::-webkit-scrollbar { display: none; }
.heatmap-week { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 12px; }

.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 3px;
  background: var(--surface-2);
}

/* Sequential, one hue, monotonic in lightness. On a dark surface the ramp
   runs dark-to-light: a day with nothing on it recedes into the background
   and a full day is the brightest step. */
.heatmap-cell.level-0 { background: var(--surface-2); }
.heatmap-cell.level-1 { background: #1c5cab; }
.heatmap-cell.level-2 { background: #2a78d6; }
.heatmap-cell.level-3 { background: #6da7ec; }
.heatmap-cell.is-future { background: transparent; border: 1px dashed var(--border); }

.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-3);
  justify-content: flex-end;
}

.heatmap-legend .heatmap-cell { width: 11px; height: 11px; aspect-ratio: auto; }

/* ---------------------------------------------------------------- charts */

.chart { display: block; width: 100%; }
.chart-empty { color: var(--text-3); font-size: 13px; padding: 14px 0; }

.spark-wrap { display: flex; flex-direction: column; gap: 3px; }
.spark-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
}
.spark-latest { color: var(--text); font-weight: 650; }

/* Diverging: positive and negative around a shared zero line. */
.netbars-track { display: flex; gap: 6px; align-items: stretch; }

.netbar {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}

.netbar-top, .netbar-bottom {
  width: 100%;
  height: 42px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.netbar-bottom { align-items: flex-start; }
.netbar-zero { height: 1px; width: 100%; background: var(--border-strong); }

/* Collapse a lane nobody is using rather than leaving a band of dead space. */
.netbars.no-pos .netbar-top { height: 10px; }
.netbars.no-neg .netbar-bottom { height: 10px; }

.netbar.is-unknown .netbar-zero { background: var(--border); }
.netbar.is-unknown .netbar-label { color: var(--text-3); font-weight: 500; }
.netbar.is-unknown .netbar-month { opacity: 0.6; }

.netbar-fill { width: 68%; border-radius: 4px 4px 0 0; }
.netbar-fill.is-pos { background: var(--series-1); }
.netbar-fill.is-neg { background: var(--status-critical); border-radius: 0 0 4px 4px; }

.netbar-label {
  font-size: 10.5px;
  font-family: var(--font-num);
  font-weight: 650;
  margin-top: 5px;
  white-space: nowrap;
}

.netbar-label.is-pos { color: var(--series-1); }
.netbar-label.is-neg { color: var(--status-critical); }
.netbar-month { font-size: 10.5px; color: var(--text-3); }

.ranked { display: flex; flex-direction: column; gap: 7px; }

.ranked-row {
  display: grid;
  grid-template-columns: 82px 1fr auto;
  gap: 9px;
  align-items: center;
}

.ranked-label {
  font-size: 12.5px;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ranked-track { height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.ranked-fill { height: 100%; background: var(--series-1); border-radius: 4px; }
.ranked-value { font-size: 12.5px; font-family: var(--font-num); color: var(--text); white-space: nowrap; }

.scores { display: flex; flex-direction: column; gap: 8px; }

.score-row {
  display: grid;
  grid-template-columns: 90px 1fr 32px;
  gap: 9px;
  align-items: center;
}

.score-label { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); }
.score-swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.score-track { height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 4px; }
.score-value { font-size: 13px; font-family: var(--font-num); text-align: right; }

.goal-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  font: inherit;
  text-align: left;
}

.goal-name { font-size: 15px; font-weight: 600; }
.goal-amounts { font-family: var(--font-num); font-size: 13.5px; color: var(--text-3); white-space: nowrap; }

.goal-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); }

.txn-day { padding-top: 6px; }
.txn-dayhead {

  justify-content: space-between;

}

.seg {

  min-height: 38px;
  border: none;
  background: transparent;
  color: var(--text-3);
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.seg.is-active { background: var(--surface-3); color: var(--text); }

.pipeline-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
.pipeline-item:last-child { border-bottom: none; }

.pipeline-main {
  width: 100%;
  background: none;
  border: none;
  text-align: left;
  padding: 0;
  cursor: pointer;
  font: inherit;
}

.pipeline-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 15.5px;
  font-weight: 620;
}

.pipeline-amount { font-family: var(--font-num); color: var(--text-2); font-weight: 600; white-space: nowrap; }
.pipeline-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.pipeline-foot { display: flex; align-items: center; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.pipeline-actions { margin-left: auto; }

.stage-picker { display: flex; flex-direction: column; }

.stage-option {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 50px;
  padding: 0 4px;
  background: none;
  border: none;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  font: inherit;
  text-align: left;
}

.stage-option:last-child { border-bottom: none; }
.stage-option.is-active { color: var(--accent); font-weight: 650; }
.stage-name { font-size: 15px; }
.stage-weight { font-size: 12px; color: var(--text-3); }

/* -------------------------------------------------------------- check-in */

.checkin-grid { display: flex; flex-direction: column; gap: 12px; }
.checkin-item { display: flex; flex-direction: column; gap: 6px; }
.checkin-label { font-size: 12.5px; color: var(--text-3); font-weight: 600; }

.scale { display: flex; gap: 6px; }

.scale-dot {
  flex: 1;
  min-height: var(--tap);
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-3);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.scale-dot.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }

.checkin-row { display: flex; gap: 10px; }
.checkin-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.stepper { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.stepper-label { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.stepper-controls { display: flex; align-items: stretch; gap: 5px; }

.stepper-btn {
  width: 40px;
  min-height: var(--tap);
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 19px;
  cursor: pointer;
}

.stepper-value {
  flex: 1;
  min-height: var(--tap);
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-family: var(--font-num);
  font-size: 17px;
  font-weight: 650;
  cursor: pointer;
  color: var(--text);
}

.stepper-value.is-unset { color: var(--text-3); font-weight: 500; }
.stepper-unit { font-size: 12px; color: var(--text-3); margin-left: 2px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.field-hint { font-size: 11.5px; color: var(--text-3); }
.field-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.input {
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-size: 16px; /* 16px stops iOS zooming on focus */
}

.input::placeholder { color: var(--text-3); }
.input:focus { border-color: var(--accent); outline: none; }
.textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
.select { appearance: none; padding-right: 30px; }

.input-wrap { position: relative; display: flex; align-items: center; }
.input-prefix {
  position: absolute;
  left: 12px;
  color: var(--text-3);
  font-size: 16px;
  pointer-events: none;
}
.input-wrap .input { padding-left: 26px; }

.quick-add { display: flex; gap: 8px; }
.quick-add .input { flex: 1; }

.journal-quick { min-height: 66px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  min-height: 38px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.chip.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }

.toggle-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-2); }
.toggle-row input { width: 20px; height: 20px; accent-color: var(--accent); }

.form { display: flex; flex-direction: column; gap: 14px; }

/* ---------------------------------------------------------------- sheets */

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(6, 7, 9, 0.68);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fade 160ms ease;
}

.sheet {
  width: 100%;
  max-width: 620px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow: var(--shadow);
  animation: rise 220ms cubic-bezier(0.22, 1, 0.36, 1);
  padding-bottom: env(safe-area-inset-bottom);
}

.sheet-grip {
  width: 36px;
  height: 4px;
  border-radius: 999px;
  background: var(--border-strong);
  margin: 8px auto 0;
  flex: none;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px 8px var(--pad);
  flex: none;
}

.sheet-title { font-size: 17px; }
.sheet-body { padding: 4px var(--pad) var(--pad); overflow-y: auto; flex: 1; }
.sheet-message { color: var(--text-2); font-size: 14.5px; }

.sheet-foot {
  display: flex;
  gap: 8px;
  padding: 12px var(--pad);
  border-top: 1px solid var(--border);
  flex: none;
}

.sheet-foot .btn { flex: 1; }

@keyframes rise { from { transform: translateY(22px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 14px);
  transform: translate(-50%, 14px);
  z-index: 95;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: min(560px, calc(100vw - 32px));
  padding: 11px 15px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow);
  font-size: 14px;
  opacity: 0;
  transition: opacity 200ms ease, transform 200ms ease;
}

.toast.is-in { opacity: 1; transform: translate(-50%, 0); }
.toast.tone-warning { border-color: var(--status-warning); }
.toast-text { min-width: 0; }

.toast-action {
  background: none;
  border: none;
  color: var(--accent);
  font-weight: 650;
  cursor: pointer;
  padding: 2px 4px;
  white-space: nowrap;
}

  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  display: flex;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;

  color: var(--text-3);
  font-size: 10.5px;
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}

.tab-icon { font-size: 17px; line-height: 1; }
.tab.is-active { color: var(--accent); }

/* --------------------------------------------------------------- review */

.week-picker {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 calc(var(--pad) * -1);
  padding: 0 var(--pad);
}

.week-picker::-webkit-scrollbar { display: none; }

.week-chip {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  min-width: 62px;
  padding: 8px 10px;

}

.review-head { display: flex; gap: 15px; align-items: center; }
.review-head-text { flex: 1; min-width: 0; }
.review-verdict { font-size: 16px; font-weight: 600; }
.review-scored { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }

.review-count { font-family: var(--font-num); font-size: 14px; color: var(--text-3); }
.review-count.is-met { color: var(--status-good); font-weight: 650; }

.review-details { margin-top: 4px; }
.review-details summary { font-size: 13.5px; color: var(--accent); cursor: pointer; padding: 6px 0; }
.review-actions { margin-top: 4px; }

.journal-list { display: flex; flex-direction: column; }

  border: none;

  cursor: pointer;
  font: inherit;
}

.journal-item:last-child { border-bottom: none; }
.journal-date { font-size: 12px; color: var(--text-3); font-weight: 600; }

.journal-win { font-size: 12.5px; color: var(--status-warning); margin-top: 4px; }

.storage-warning {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 10px);
  z-index: 60;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--critical-soft);
  border: 1px solid var(--status-critical);
  color: var(--text);
  font-size: 13px;
}

/* --------------------------------------------------------------- wider */

@media (min-width: 620px) {
  .checkin-grid { flex-direction: row; }
  .checkin-item { flex: 1; }
  .greeting-text { font-size: 30px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

<script>

/* ==== core/util ==== */
/* Keel — core utilities. Pure logic, no DOM. */
(function (K) {
  'use strict';

  /* ---------------------------------------------------------------- ids */

  // Monotonic-ish, collision-resistant enough for a single-device app.
  function uid(prefix) {
    const t = Date.now().toString(36);
    const r = Math.random().toString(36).slice(2, 8);
    return (prefix ? prefix + '_' : '') + t + r;

  /* -------------------------------------------------------------- dates */
  /* Everything user-facing is a local calendar day held as 'YYYY-MM-DD'.
     We never round-trip through UTC, because a UK user in BST would
     otherwise see their day flip an hour early. */

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function toISODate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function fromISODate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    // Reject impossible dates like 2026-02-31 that Date would roll over.
    if (d.getFullYear() !== Number(m[1]) || d.getMonth() !== Number(m[2]) - 1) return null;
    return d;
  }

  function isISODate(s) { return fromISODate(s) !== null; }

  function today(now) { return toISODate(now instanceof Date ? now : new Date()); }

  function addDays(iso, n) {
    const d = fromISODate(iso);
    if (!d) return null;
    d.setDate(d.getDate() + n);
    return toISODate(d);
  }

  function addMonths(iso, n) {
    const d = fromISODate(iso);
    if (!d) return null;
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    // Clamp: 31 Jan + 1 month is 28/29 Feb, not 3 March.
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return toISODate(d);

  function daysBetween(a, b) {
    const da = fromISODate(a), db = fromISODate(b);
    if (!da || !db) return null;
    // Compare at UTC noon so a DST boundary can't shave or add an hour.
    const ua = Date.UTC(da.getFullYear(), da.getMonth(), da.getDate(), 12);
    const ub = Date.UTC(db.getFullYear(), db.getMonth(), db.getDate(), 12);
    return Math.round((ub - ua) / 86400000);

  // ISO-8601 week: weeks start Monday; week 1 contains the first Thursday.
  function startOfWeek(iso) {
    const d = fromISODate(iso);
    if (!d) return null;
    const dow = (d.getDay() + 6) % 7; // Mon=0 .. Sun=6
    d.setDate(d.getDate() - dow);
    return toISODate(d);
  }

  function endOfWeek(iso) {
    const s = startOfWeek(iso);
    return s ? addDays(s, 6) : null;
  }

  function startOfMonth(iso) {
    const d = fromISODate(iso);
    return d ? toISODate(new Date(d.getFullYear(), d.getMonth(), 1)) : null;

  function endOfMonth(iso) {
    const d = fromISODate(iso);
    return d ? toISODate(new Date(d.getFullYear(), d.getMonth() + 1, 0)) : null;

  function monthKey(iso) { return String(iso || '').slice(0, 7); }

  function isoWeekKey(iso) {
    const d = fromISODate(iso);
    if (!d) return null;
    const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    // Shift to the Thursday of this week; its year is the ISO week-year.
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    const week1 = new Date(t.getFullYear(), 0, 4);
    week1.setDate(week1.getDate() + 3 - ((week1.getDay() + 6) % 7));

  // never spin the UI into an unbounded loop.

    if (!isISODate(from) || !isISODate(to)) return out;
    let guard = 0;
    while (cur && daysBetween(cur, to) >= 0 && guard++ < limit) {

      cur = addDays(cur, 1);

  const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',

    if (style === 'long') return dn + ' ' + d.getDate() + ' ' + mn + ' ' + d.getFullYear();
    if (style === 'medium') return dn + ' ' + d.getDate() + ' ' + mn.slice(0, 3);
    if (style === 'month') return mn + ' ' + d.getFullYear();
    return d.getDate() + ' ' + mn.slice(0, 3);

    const base = ref || today();

    if (n === 1) return 'tomorrow';
    if (n === -1) return 'yesterday';
    if (n > 0) return 'in ' + n + ' days';
    return -n + ' days ago';

  /* -------------------------------------------------------------- money */
  /* Stored as integer pence. Floating-point pounds accumulate error fast
     once you start summing a year of transactions. */

  function toPence(pounds) {
    const n = Number(pounds);
    if (!isFinite(n)) return 0;
    return Math.round(n * 100);

  function toPounds(pence) { return (Number(pence) || 0) / 100; }

  function formatMoney(pence, opts) {
    const o = opts || {};
    const symbol = o.symbol === undefined ? '£' : o.symbol;
    const n = Number(pence) || 0;

    return C.checkRow({

      h('span.stepper-label', opts.label),
      h('div.stepper-controls', [

        h('button.stepper-value' + (has ? '' : '.is-unset'), {
          type: 'button',
          'aria-label': opts.label + (has ? ' ' + value + opts.unit : ' not set'),
          onclick: function () { opts.onChange(has ? null : (opts.start || opts.step)); }
        }, has ? [String(value), h('span.stepper-unit', opts.unit)] : '—'),
        h('button.stepper-btn', {
          type: 'button', 'aria-label': 'More ' + opts.label,
          onclick: function () { bump(opts.step); }

  function moneyCard(ctx) {

    const monthKey = U.monthKey(ctx.today);

      action: h('a.card-link', { href: '#/money' }, 'Open')

        C.stat({

          unit: r.months === null ? '' : ' mo',
          label: 'Runway',
          tone: runwayTone(r.status),

        }),
        C.stat({
          value: U.formatMoney(month.netPence, { round: true, plus: true }),
          label: 'This month',
          tone: month.netPence >= 0 ? 'good' : 'critical'
        })
      ]),
      h('div.quick-money', [

  function runwayTone(status) {

/* Keel — Money: cash, runway, what comes in and what goes out. */
(function (K) {
  'use strict';

  const h = K.Dom.h, C = K.C, U = K.Util, M = K.Model, Mo = K.Money, Ch = K.Charts;

  K.Screens = K.Screens || {};

  K.Screens.money = {
    render: function (ctx) {
      return [
        headline(ctx),
        goalsCard(ctx),
        monthCard(ctx),
        streamsCard(ctx),
        recurringCard(ctx),
        transactionsCard(ctx)
      ];
    }
  };

  /* ------------------------------------------------------------- headline */

  function headline(ctx) {
    const st = ctx.state;
    const r = Mo.runway(st, ctx.today);
    const est = Mo.burnEstimate(st, ctx.today);

    return C.card({ class: 'money-headline' }, [
      h('div.cash-block', [
        h('button.cash-value', {
          type: 'button',
          'aria-label': 'Update cash balance',
          onclick: function () { cashEditor(ctx); }
        }, U.formatMoney(st.money.cashPence)),
        h('p.cash-label', st.money.cashUpdated
          ? 'Cash · updated ' + U.relativeDay(st.money.cashUpdated, ctx.today)
          : 'Tap to set your cash balance')
      ]),

      h('div.runway', [
        runwayLine(r, st),
        h('div.runway-basis', basisText(est))
      ]),

      C.statRow([
        C.stat({
          value: U.formatMoney(est.incomePence, { round: true }),
          label: 'In a month'
        }),
        C.stat({
          value: U.formatMoney(est.expensePence, { round: true }),
          label: 'Out a month'
        }),
        C.stat({
          value: U.formatMoney(est.netPence, { round: true, plus: true }),
          label: 'Net',
          tone: est.netPence >= 0 ? 'good' : 'critical'
        })
      ])
    ]);
  }

  function runwayLine(r, st) {
    if (r.basis === 'none') {
      return h('p.runway-text', 'Add a few regular items below and Keel will work out how long your money lasts.');
    }
    if (r.status === 'growing') {
      return h('p.runway-text.tone-good', 'Your cash is growing, not shrinking.');
    }
    const tone = r.status === 'critical' ? 'critical' : r.status === 'low' ? 'warning' : 'good';
    const cap = Math.min(r.months, 24);
    return h('div.runway-line', [
      h('div.runway-bar', h('div.runway-fill.tone-' + tone, {
        style: { width: U.clamp((cap / 12) * 100, 4, 100) + '%' }
      })),
      h('p.runway-text.tone-' + tone, [
        h('strong', r.months + (r.months === 1 ? ' month' : ' months')),
        ' of runway · empty around ' + U.formatDate(r.zeroDate, 'medium')
      ])
    ]);
  }

  function basisText(est) {
    if (est.basis === 'actual') {
      return 'Based on what you actually logged over ' +
        U.plural(est.monthsSampled, 'month') + '.';
    }
    if (est.basis === 'planned') {
      return 'Based on your regular items. Log some transactions and this ' +
        'switches to your real numbers.';
    }
    return 'Nothing to go on yet.';
  }

  function cashEditor(ctx) {
    K.Forms.editor({
      title: 'Cash balance',
      initial: { amount: K.Forms.poundsString(ctx.state.money.cashPence) },
      validate: function (d) {
        return U.parseMoney(d.amount) === null ? 'Enter an amount.' : null;
      },
      fields: function (d, set) {
        return [
          C.field({
            label: 'Everything you can spend today', prefix: '£',
            inputMode: 'decimal', value: d.amount, focusKey: 'cash',
            hint: 'Current accounts plus easy-access savings. Not pension or stock.',
            onInput: function (e) { set('amount', e.target.value); }
          })
        ];
      },
      onSave: function (d) { ctx.actions.setCash(U.parseMoney(d.amount) || 0); }
    });
  }

  /* ---------------------------------------------------------------- goals */

  function goalsCard(ctx) {
    const goals = ctx.state.money.goals.filter(function (g) { return !g.archived; });
    const surplus = Math.max(0, Mo.burnEstimate(ctx.state, ctx.today).netPence);

    return C.card({
      title: 'Goals',
      action: C.button('Add', {
        size: 'sm', onClick: function () { K.Forms.goalEditor(ctx, null); }
      })
    }, goals.length ? h('div.list', goals.map(function (g) {
      const p = Mo.goalProjection(g, surplus, ctx.today);
      return h('div.goal', [
        h('button.goal-head', {
          type: 'button',
          onclick: function () { K.Forms.goalEditor(ctx, g); }
        }, [
          h('div.goal-name', g.label),
          h('div.goal-amounts', [
            h('strong', U.formatMoney(g.savedPence, { round: true })),
            h('span', ' of ' + U.formatMoney(g.targetPence, { round: true }))
          ])
        ]),
        C.progress(p.progressPct / 100, p.onTrack === false ? 'warning' : 'good'),
        h('div.goal-foot', [
          h('span', goalNote(g, p, ctx)),
          C.button('+ £10', {
            size: 'sm', variant: 'ghost',
            onClick: function () { ctx.actions.contributeToGoal(g.id, 1000); }
          })
        ])
      ]);
    })) : C.empty('No goals yet. Even a small one gives the surplus somewhere to go.'));
  }

  function goalNote(g, p, ctx) {
    if (p.remainingPence === 0) return 'Done.';
    if (g.targetDate && p.requiredMonthlyPence) {
      return (p.onTrack ? 'On track · ' : 'Needs ') +
        U.formatMoney(p.requiredMonthlyPence, { round: true }) + '/mo to hit ' +
        U.formatDate(g.targetDate, 'short');
    }
    if (p.projectedDate) {
      return U.formatMoney(p.monthlyPence, { round: true }) + '/mo → ' +
        U.formatDate(p.projectedDate, 'short');
    }
    return U.formatMoney(p.remainingPence, { round: true }) + ' to go';
  }

  /* ---------------------------------------------------------- this month */

  function monthCard(ctx) {
    const history = Mo.monthHistory(ctx.state, 6, ctx.today);
    const current = history[history.length - 1];
    const cats = U.sortBy(Object.keys(current.byCategory).map(function (c) {
      return { label: U.humanise(c), value: current.byCategory[c],
        display: U.formatMoney(current.byCategory[c], { round: true }) };
    }), function (c) { return c.value; }, 'desc').slice(0, 6);

    const hasAny = history.some(function (m) { return m.count > 0; });

    return C.card({
      title: 'Month by month',
      subtitle: hasAny ? 'What you kept, six months back' : null
    }, hasAny ? [
      Ch.netBars(history),
      cats.length ? [
        h('h3.subhead', 'Where it went this month'),
        Ch.rankedBars(cats)
      ] : null
    ] : C.empty('Log a few transactions and the shape of your months shows up here.'));
  }

  /* -------------------------------------------------------------- streams */

  function streamsCard(ctx) {
    const cov = Mo.streamCoverage(ctx.state, ctx.today);
    if (!cov.months || !cov.streams.length) return null;

    return C.card({
      title: 'Where the money comes from',
      subtitle: 'Monthly average over ' + U.plural(cov.months, 'month')
    }, h('div.list', cov.streams.map(function (s) {
      return C.row({
        title: s.label,
        subtitle: s.coveragePct !== null
          ? 'Covers ' + s.coveragePct + '% of your outgoings' : null,
        trailing: h('strong.row-amount', U.formatMoney(s.monthlyPence, { round: true }))
      });
    })));
  }

  /* ------------------------------------------------------------ recurring */

  function recurringCard(ctx) {
    const items = ctx.state.money.recurring;
    const planned = Mo.plannedMonthly(ctx.state);
    const sorted = U.sortBy(items, function (r) { return -Mo.monthlyAmount(r); });

    return C.card({
      title: 'Regular money',
      subtitle: items.length
        ? U.formatMoney(planned.incomePence, { round: true }) + ' in · ' +
          U.formatMoney(planned.expensePence, { round: true }) + ' out, every month'
        : null,
      action: C.button('Add', {
        size: 'sm', onClick: function () { K.Forms.recurringEditor(ctx, null); }
      })
    }, sorted.length ? h('div.list', sorted.map(function (r) {
      const monthly = Math.round(Mo.monthlyAmount(r));
      return C.row({
        class: r.active ? null : 'is-muted',
        title: r.label,
        subtitle: (M.statusMeta(M.CADENCES, r.cadence) || {}).label +
          (r.cadence !== 'monthly' ? ' · ' + U.formatMoney(monthly, { round: true }) + '/mo' : '') +
          (r.dueDay ? ' · ' + ordinal(r.dueDay) : ''),
        trailing: h('strong.row-amount' + (r.kind === 'income' ? '.tone-good' : ''),
          (r.kind === 'income' ? '+' : '−') + U.formatMoney(r.amountPence, { round: true })),
        onClick: function () { K.Forms.recurringEditor(ctx, r); }
      });
    })) : C.empty('Add your rent, bills and any regular income. This is what makes runway real.'));
  }

  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  /* --------------------------------------------------------- transactions */

  function transactionsCard(ctx) {
    const all = U.sortBy(ctx.state.money.transactions, function (t) { return t.date; }, 'desc');
    const recent = all.slice(0, 30);
    const byDay = U.groupBy(recent, function (t) { return t.date; });
    const days = Object.keys(byDay).sort().reverse();

    return C.card({
      title: 'Recent',
      subtitle: all.length > 30 ? 'Latest 30 of ' + all.length : null,
      action: C.button('Add', {
        size: 'sm', onClick: function () { K.Forms.transactionEditor(ctx, null); }
      })
    }, days.length ? days.map(function (d) {
      const items = byDay[d];
      const net = U.sum(items.map(function (t) {
        return t.kind === 'income' ? t.amountPence : -t.amountPence;
      }));
      return h('div.txn-day', [
        h('div.txn-dayhead', [
          h('span', U.formatDate(d, 'medium')),
          h('span.txn-daynet', U.formatMoney(net, { plus: true, round: true }))
        ]),
        h('div.list', items.map(function (t) {
          return C.row({
            title: t.label,
            subtitle: t.kind === 'income'
              ? K.Export.streamLabel(t.stream) : U.humanise(t.category),
            trailing: h('strong.row-amount' + (t.kind === 'income' ? '.tone-good' : ''),
              (t.kind === 'income' ? '+' : '−') + U.formatMoney(t.amountPence)),
            onClick: function () { K.Forms.transactionEditor(ctx, t); }
          });
        }))
      ]);
    }) : C.empty('Nothing logged yet. Two taps on Today adds one.'));
  }

/* Keel — Work: job applications and freelance jobs in one pipeline. */
(function (K) {
  'use strict';

  const h = K.Dom.h, C = K.C, U = K.Util, M = K.Model, W = K.Work;

  K.Screens = K.Screens || {};

    render: function (ctx) {

        overview(ctx),
        h('div.segmented', { role: 'tablist' }, [
          segButton('Applications', 'jobs', tab, ctx),
          segButton('Freelance', 'gigs', tab, ctx)
        ]),
        tab === 'gigs' ? gigsPane(ctx) : applicationsPane(ctx)
      ];
    }
  };

  function segButton(label, id, active, ctx) {
    return h('button.seg' + (active === id ? '.is-active' : ''), {
      type: 'button', role: 'tab', 'aria-selected': active === id ? 'true' : 'false',
      onclick: function () { ctx.go('#/work/' + id); }
    }, label);
  }

  /* ------------------------------------------------------------- overview */

  function overview(ctx) {
    const pv = W.pipelineValue(ctx.state);
    const owed = W.unpaid(ctx.state);
    const rr = W.responseRate(ctx.state, ctx.today);

    return C.card({ title: 'Pipeline' }, [
      C.statRow([
        C.stat({
          value: String(pv.applications.count),
          label: 'Live applications',
          note: pv.applications.expectedPence
            ? U.formatMoney(pv.applications.expectedPence, { compact: true }) + ' weighted'
            : null
        }),
        C.stat({
          value: String(pv.gigs.count),
          label: 'Open jobs',
          note: pv.gigs.expectedPence
            ? U.formatMoney(pv.gigs.expectedPence, { compact: true }) + ' weighted'
            : null
        }),
        C.stat({
          value: owed.totalPence ? U.formatMoney(owed.totalPence, { compact: true }) : '—',
          label: 'Owed to you',
          tone: owed.totalPence ? 'warning' : null
        })
      ]),
      rr.sample >= 5 ? h('p.card-note',
        Math.round(rr.pct) + '% of your ' + rr.sample +
        ' mature applications got a reply.') : null
    ]);
  }

  /* --------------------------------------------------------- applications */

  function applicationsPane(ctx) {
    const st = ctx.state;
    const follow = W.needsFollowUp(st, ctx.today);
    const followIds = {};
    follow.forEach(function (f) { followIds[f.application.id] = f.silentDays; });

    // Furthest through the process first, oldest first within a stage. Two
    // stable passes, because a negative number folded into a string key
    // sorts -0.45 ahead of -0.9 and reverses the whole list.
    const open = U.sortBy(
      U.sortBy(W.openApplications(st), function (a) { return a.appliedDate; }),
      function (a) { return -W.appMeta(a.status).weight; }
    );
    const closed = U.sortBy(W.closedApplications(st), function (a) { return a.updatedAt; }, 'desc');

    return [
      follow.length ? C.card({
        title: 'Worth a nudge',
        tone: 'warn'
      }, h('div.list', follow.slice(0, 5).map(function (f) {
        return C.row({
          title: f.application.company,
          subtitle: (f.application.role ? f.application.role + ' · ' : '') +
            'silent ' + U.plural(f.silentDays, 'day'),
          trailing: C.button('Chased', {
            size: 'sm', variant: 'ghost',
            onClick: function () {
              ctx.actions.updateApplication(f.application.id, { lastContact: ctx.today });
              C.toast('Marked as chased today');
            }
          }),
          onClick: function () { K.Forms.applicationEditor(ctx, f.application); }
        });
      }))) : null,

      C.card({
        title: 'Applications',
        // 'live' here is an adjective, so it must not be pluralised.
        subtitle: open.length ? open.length + ' live' : null,

          size: 'sm', onClick: function () { K.Forms.applicationEditor(ctx, null); }

      closed.length ? C.card({
        title: 'Closed',
        subtitle: U.plural(closed.length, 'application')
      }, h('div.list.is-muted', closed.slice(0, 15).map(function (a) {
        return C.row({
          title: a.company,
          subtitle: (a.role ? a.role + ' · ' : '') + W.appMeta(a.status).label,
          onClick: function () { K.Forms.applicationEditor(ctx, a); }
        });
      }))) : null
    ];
  }

  function applicationRow(ctx, a, silentDays) {
    const meta = W.appMeta(a.status);
    const age = U.daysBetween(a.appliedDate, ctx.today);

    return h('div.pipeline-item', [
      h('button.pipeline-main', {
        type: 'button',
        onclick: function () { K.Forms.applicationEditor(ctx, a); }
      }, [
        h('div.pipeline-title', [
          a.company,
          a.salaryPence ? h('span.pipeline-amount',
            U.formatMoney(a.salaryPence, { compact: true })) : null
        ]),
        h('div.pipeline-sub', [
          a.role || 'Role not set',
          ' · applied ' + U.plural(age === null ? 0 : age, 'day') + ' ago',
          a.nextActionDate ? ' · ' + (a.nextAction || 'next step') + ' ' +
            U.relativeDay(a.nextActionDate, ctx.today) : ''
        ])
      ]),
      h('div.pipeline-foot', [
        C.pill(meta.label, stageTone(a.status)),
        silentDays ? C.pill('quiet ' + silentDays + 'd', 'warning') : null,
        h('div.pipeline-actions', [
          C.iconButton('→', {
            label: 'Move ' + a.company + ' to the next stage',
            onClick: function () { advanceApplication(ctx, a); }
          })

/* ==== ui/screen-tasks ==== */
/* Keel — Tasks: everything open, grouped the way you actually think about it. */
(function (K) {
  'use strict';

  const h = K.Dom.h, C = K.C, U = K.Util, T = K.Tasks;

  K.Screens = K.Screens || {};

  const VIEWS = [
    { id: 'now', label: 'Now' },
    { id: 'projects', label: 'Projects' },
    { id: 'someday', label: 'Someday' },
    { id: 'done', label: 'Done' }
  ];

  K.Screens.tasks = {
    render: function (ctx) {
      const view = ctx.param || 'now';
      return [
        header(ctx),
        h('div.segmented', { role: 'tablist' }, VIEWS.map(function (v) {
          return h('button.seg' + (view === v.id ? '.is-active' : ''), {
            type: 'button', role: 'tab',
            'aria-selected': view === v.id ? 'true' : 'false',
            onclick: function () { ctx.go('#/tasks/' + v.id); }
          }, v.label);
        })),
        view === 'projects' ? projectsView(ctx)
          : view === 'someday' ? somedayView(ctx)
          : view === 'done' ? doneView(ctx)
          : nowView(ctx)
      ];
    }
  };

  function header(ctx) {
    const counts = T.counts(ctx.state, ctx.today);
    return C.card({ class: 'tasks-head' }, [
      C.statRow([
        C.stat({ value: String(counts.active), label: 'Open' }),
        C.stat({
          value: String(counts.overdue), label: 'Overdue',
          tone: counts.overdue ? 'critical' : null
        }),
        C.stat({ value: String(counts.dueToday), label: 'Due today' })
      ]),
      h('div.quick-add', [
        h('input.input', {
          type: 'text',
          placeholder: 'Add a task…',
          'data-focus-key': 'tasks-quick',
          enterkeyhint: 'done',
          onkeydown: function (e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const v = e.target.value.trim();
            if (!v) return;
            ctx.actions.addTask({ title: v });
            e.target.value = '';
          }
        }),
        C.button('More', {
          variant: 'ghost', size: 'sm',
          onClick: function () { K.Forms.taskEditor(ctx, null); }
        })
      ])
    ]);
  }

  /* ------------------------------------------------------------------ now */

  function nowView(ctx) {
    const st = ctx.state, day = ctx.today;
    const overdue = T.overdue(st, day);
    const today = T.dueToday(st, day);
    const soon = T.dueWithin(st, 7, day).filter(function (t) {
      return U.daysBetween(day, t.dueDate) > 0;
    });
    const undated = T.active(st).filter(function (t) { return !t.dueDate; });

    return [
      group(ctx, 'Overdue', overdue, 'critical'),
      group(ctx, 'Today', today),
      group(ctx, 'Next seven days', soon),
      group(ctx, 'No date', U.sortBy(undated, function (t) {
        return -t.priority + '|' + t.createdAt;
      })),
      (!overdue.length && !today.length && !soon.length && !undated.length)
        ? C.card({}, C.empty('Nothing open. Enjoy it.')) : null
    ];
  }

  function group(ctx, title, list, tone) {
    if (!list.length) return null;
    return C.card({
      title: title,
      subtitle: U.plural(list.length, 'task'),
      tone: tone === 'critical' ? 'warn' : null
    }, h('div.list', list.map(function (t) { return taskRow(ctx, t); })));
  }

  function taskRow(ctx, t) {
    const day = ctx.today;
    const project = t.projectId
      ? ctx.state.projects.filter(function (p) { return p.id === t.projectId; })[0]
      : null;
    const late = t.dueDate && U.daysBetween(day, t.dueDate) < 0;
    const bits = [];
    if (project) bits.push(project.name);
    if (t.dueDate) bits.push(U.relativeDay(t.dueDate, day));
    if (t.priority === 3) bits.push('High');

    return C.checkRow({
      done: t.done,
      title: t.title,
      subtitle: bits.length ? bits.join(' · ') : null,
      onToggle: function () {
        ctx.actions.toggleTask(t.id);
        if (!t.done) C.toast('Done', {
          actionLabel: 'Undo', onAction: function () { ctx.store.undo(); }
        });
      },
      onOpen: function () { K.Forms.taskEditor(ctx, t); },
      trailing: late ? C.pill('late', 'critical') : null
    });
  }

  /* ------------------------------------------------------------- projects */

  function projectsView(ctx) {
    const groups = T.byProject(ctx.state);
    return [
      C.card({
        title: 'Projects',
        action: C.button('Add', {
          size: 'sm', onClick: function () { K.Forms.projectEditor(ctx, null); }
        })
      }, groups.length ? null : C.empty('No projects yet.')),
      groups.map(function (g) {
        const open = g.tasks.filter(function (t) { return !t.done; });
        return C.card({
          title: g.project.name,
          subtitle: g.open + ' open · ' + g.done + ' done',
          action: g.project.id ? C.iconButton('✎', {
            label: 'Edit ' + g.project.name,
            onClick: function () { K.Forms.projectEditor(ctx, g.project); }
          }) : null
        }, open.length
          ? h('div.list', U.sortBy(open, function (t) {
              return (t.dueDate || '9999') + '|' + (9 - t.priority);
            }).map(function (t) { return taskRow(ctx, t); }))
          : C.empty('Nothing open here.'));
      })
    ];
  }

  /* -------------------------------------------------------------- someday */

  function somedayView(ctx) {
    const list = T.open(ctx.state).filter(function (t) { return t.someday; });
    const stale = T.stale(ctx.state, 30, ctx.today);

  // one of those would fight the caret, so those changes are left to the
  // input itself and the screen redraws on the next real action.
  const SILENT_REASONS = { patch: 1, focus: 1, checkin: 1, journal: 1, profile: 1, review: 1 };

  function create(store) {
    let root = null;
    let currentRoute = null;
    let scrollPositions = {};
    let pendingRender = null;

    /* ------------------------------------------------------------ routing */

    function parseRoute() {
      const raw = (location.hash || '#/today').replace(/^#\/?/, '');
      const parts = raw.split('/').filter(Boolean);
      return {
        screen: parts[0] || 'today',
        param: parts[1] || null,
        sub: parts[2] || null
      };
    }

    function go(route) {
      if (location.hash === route) render();
      else location.hash = route;
    }

    function onHashChange() {
      const next = parseRoute();
      const key = next.screen + '/' + (next.param || '');
      if (currentRoute && currentRoute.key === key) return;
      C.closeSheet();
      render();
      // Landing on a new screen should start at the top, but coming back to
      // a tab should land where you left it.
      const saved = scrollPositions[key];
      requestAnimationFrame(function () {
        window.scrollTo(0, saved || 0);
      });
    }

    function rememberScroll() {
      if (currentRoute) scrollPositions[currentRoute.key] = window.scrollY;
    }

    /* ------------------------------------------------------------- render */

    function render() {
      if (!root) return;
      const r = parseRoute();
      const key = r.screen + '/' + (r.param || '');
      const screen = K.Screens[r.screen] || K.Screens.today;
      const saved = K.Dom.captureFocus(root);

      currentRoute = { key: key, screen: r.screen, param: r.param, sub: r.sub };

      const ctx = {
        store: store,
        state: store.state,
        actions: store.actions,
        today: store.today(),
        param: r.param,
        sub: r.sub,
        go: go,
        render: render,
        refresh: scheduleRender
      };

      const body = h('main.screen', { id: 'screen', tabindex: '-1' }, screen.render(ctx));
      const activeTab = TAB_OF[r.screen] || r.screen;

      K.Dom.mount(root, [
        chrome(ctx, r),
        body,
        tabBar(activeTab),
        store.error ? h('div.storage-warning', { role: 'alert' }, store.error) : null
      ]);

      K.Dom.restoreFocus(root, saved);
    }

    function scheduleRender() {
      if (pendingRender) return;
      pendingRender = requestAnimationFrame(function () {
        pendingRender = null;
        render();
      });
    }

    /* ------------------------------------------------------------- chrome */

    function chrome(ctx, r) {
      const backTo = r.screen === 'tasks' ? '#/today'
        : (r.screen === 'settings' ? '#/review' : null);

      return h('header.appbar', [
        backTo
          ? C.iconButton('‹', { label: 'Back', onClick: function () { go(backTo); } })
          : h('div.appbar-brand', [
              h('span.appbar-mark', 'K'),
              h('span.appbar-name', 'Keel')
            ]),
        h('div.appbar-mid', h('span.appbar-date', U.formatDate(ctx.today, 'medium'))),
        h('div.appbar-actions', [
          store.canUndo()
            ? C.iconButton('↺', {
                label: 'Undo ' + (store.lastUndoLabel() || 'last change'),
                onClick: function () {
                  const label = store.undo();
                  if (label) C.toast('Undid ' + label, { tone: 'info' });
                }
              })
            : null,
          C.iconButton('⚙', { label: 'Settings', onClick: function () { go('#/settings'); } })
        ])
      ]);
    }

    function tabBar(active) {
      return h('nav.tabbar', { 'aria-label': 'Main' }, TABS.map(function (t) {
        const isActive = t.id === active;
        return h('a.tab' + (isActive ? '.is-active' : ''), {
          href: t.route,
          'aria-current': isActive ? 'page' : null
        }, [
          h('span.tab-icon', { 'aria-hidden': 'true' }, t.icon),
          h('span.tab-label', t.label)
        ]);
      }));
    }

    /* --------------------------------------------------------------- boot */

    function mount(el) {
      root = el;
      store.load();

      store.subscribe(function (state, reason) {
        if (SILENT_REASONS[reason]) return;
        scheduleRender();
      });

      window.addEventListener('hashchange', onHashChange);
      window.addEventListener('scroll', rememberScroll, { passive: true });

      // A tab left open past midnight should wake up on the new day rather
      // than quietly logging to yesterday.
      let lastDay = store.today();
      setInterval(function () {
        const now = U.today();
        if (now !== lastDay) {
          lastDay = now;
          scheduleRender();
        }
      }, 60000);

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) scheduleRender();
      });

      window.addEventListener('beforeunload', function () { store.saveNow(); });

      if (!location.hash) location.hash = '#/today';
      render();
    }

    return { mount: mount, render: render, go: go, TABS: TABS };
  }

  K.App = { create: create, TABS: TABS };
})(globalThis.Keel = globalThis.Keel || {});


/* ==== ui/boot ==== */
/* Keel — boot. Runs last, after every module has registered itself. */
(function (K) {

  function pickStorage() {
    // Feature-detect properly: Safari in private mode exposes localStorage
    // but throws on write, so a presence check is not enough.
    try {
      const probe = '__keel_probe__';
      localStorage.setItem(probe, '1');
      localStorage.removeItem(probe);
      return localStorage;
    } catch (e) {
      return K.Store.memoryStorage();
    }
  }

  function start() {
    const root = document.getElementById('app');
    if (!root) return;

    const store = K.Store.create({ storage: pickStorage() });
    const app = K.App.create(store);

    K.instance = { store: store, app: app };
    app.mount(root);

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {
          // Offline caching is a bonus; the app works without it.
        });
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

</script>
