<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarkov Progression Tracker</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --card: #1c1c1c;
    --border: #2a2a2a;
    --gold: #c8a45c;
    --gold-dim: #8a6f3a;
    --green: #4a7c59;
    --green-bright: #6ab87f;
    --red: #8b3a3a;
    --text: #d4cfc8;
    --text-dim: #7a756e;
    --text-muted: #4a4540;
    --accent: #c8a45c;
    --tab-active: #1e1a14;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--gold);
    clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #0d0d0d;
    font-weight: bold;
    flex-shrink: 0;
  }
  .logo-text h1 {
    font-size: 18px;
    color: var(--gold);
    letter-spacing: 3px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .logo-text p {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .header-stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .stat-chip {
    text-align: center;
  }
  .stat-chip .label {
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .stat-chip .value {
    font-size: 16px;
    color: var(--gold);
    font-weight: bold;
  }

  /* ── KAPPA BAR ── */
  .kappa-bar-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 14px;
  }
  .kappa-bar-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .kappa-bar-label span:first-child {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .kappa-bar-label span:last-child {
    font-size: 11px;
    color: var(--text-dim);
  }
  .kappa-bar-track {
    height: 8px;
    background: #0d0d0d;
    border-radius: 1px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .kappa-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 1px;
    transition: width 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  .kappa-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15));
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    gap: 2px;
    overflow-x: auto;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 10px 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
    background: var(--tab-active);
  }
  .tab-btn .count-badge {
    display: inline-block;
    background: var(--border);
    color: var(--text-dim);
    border-radius: 2px;
    padding: 1px 5px;
    font-size: 9px;
    margin-left: 6px;
  }
  .tab-btn.active .count-badge { background: var(--gold-dim); color: #0d0d0d; }

  /* ── CONTENT ── */
  .content {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-input {
    flex: 1;
    min-width: 180px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 2px;
    outline: none;
  }
  .search-input:focus { border-color: var(--gold-dim); }
  .search-input::placeholder { color: var(--text-muted); }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 12px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active { border-color: var(--gold-dim); color: var(--gold); }
  .reset-btn {
    background: none;
    border: 1px solid var(--red);
    color: var(--red);
    padding: 7px 12px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    margin-left: auto;
  }
  .reset-btn:hover { background: var(--red); color: #fff; }

  /* ── TRADER SECTION ── */
  .trader-section {
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .trader-header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--card);
    user-select: none;
    gap: 10px;
  }
  .trader-header:hover { background: #222; }
  .trader-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .trader-name {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: bold;
    flex: 1;
  }
  .trader-progress {
    font-size: 11px;
    color: var(--text-dim);
  }
  .trader-progress .done { color: var(--green-bright); }
  .trader-chevron {
    color: var(--text-muted);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .trader-section.collapsed .trader-chevron { transform: rotate(-90deg); }
  .trader-mini-bar {
    height: 2px;
    background: var(--border);
    width: 60px;
    border-radius: 1px;
    overflow: hidden;
  }
  .trader-mini-fill {
    height: 100%;
    border-radius: 1px;
    transition: width 0.3s;
  }

  /* ── QUEST LIST ── */
  .quest-list {
    border-top: 1px solid var(--border);
  }
  .trader-section.collapsed .quest-list { display: none; }
  .quest-item {
    display: flex;
    align-items: center;
    padding: 9px 14px 9px 20px;
    border-bottom: 1px solid #1a1a1a;
    gap: 10px;
    transition: background 0.15s;
  }
  .quest-item:last-child { border-bottom: none; }
  .quest-item:hover { background: #1a1a1a; }
  .quest-item.completed { opacity: 0.5; }
  .quest-item.completed .quest-name { text-decoration: line-through; }
  .quest-item.hidden { display: none; }
  .quest-checkbox {
    width: 16px;
    height: 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 1px;
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    appearance: none;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .quest-checkbox:checked {
    background: var(--green);
    border-color: var(--green-bright);
  }
  .quest-checkbox:checked::after {
    content: '✓';
    position: absolute;
    top: -2px;
    left: 1px;
    font-size: 12px;
    color: var(--green-bright);
  }
  .quest-name {
    flex: 1;
    font-size: 13px;
    color: var(--text);
  }
  .quest-level {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ── HIDEOUT ── */
  .hideout-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .station-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .station-header {
    padding: 10px 14px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .station-header:hover { background: #222; }
  .station-icon { font-size: 18px; }
  .station-name {
    flex: 1;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .station-progress-text {
    font-size: 10px;
    color: var(--text-dim);
  }
  .station-body { border-top: 1px solid var(--border); }
  .station-card.collapsed .station-body { display: none; }
  .station-level {
    border-bottom: 1px solid #1a1a1a;
    padding: 8px 14px;
  }
  .station-level:last-child { border-bottom: none; }
  .level-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .level-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .level-done-badge {
    font-size: 9px;
    background: var(--green);
    color: var(--green-bright);
    padding: 1px 5px;
    border-radius: 1px;
    display: none;
  }
  .station-level.level-complete .level-done-badge { display: inline; }
  .item-list { display: flex; flex-direction: column; gap: 4px; }
  .item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
  }
  .item-checkbox {
    width: 14px;
    height: 14px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 1px;
    flex-shrink: 0;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    transition: all 0.15s;
  }
  .item-checkbox:checked {
    background: var(--gold-dim);
    border-color: var(--gold);
  }
  .item-checkbox:checked::after {
    content: '✓';
    position: absolute;
    top: -2px;
    left: 0px;
    font-size: 11px;
    color: var(--gold);
  }
  .item-name {
    flex: 1;
    font-size: 12px;
    color: var(--text);
  }
  .item-qty {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .item-row.item-checked .item-name { text-decoration: line-through; color: var(--text-muted); }

  /* ── SECTION PROGRESS BAR ── */
  .section-bar-wrap { margin-bottom: 16px; }
  .section-bar-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .section-bar-fill {
    height: 100%;
    background: var(--green-bright);
    border-radius: 2px;
    transition: width 0.3s;
  }
  .section-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 1px;
  }

  @media (max-width: 600px) {
    .header-stats { gap: 12px; }
    .content { padding: 12px; }
    .hideout-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">T</div>
      <div class="logo-text">
        <h1>Tarkov Tracker</h1>
        <p>Progression &amp; Quest Log</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-chip">
        <div class="label">Kappa</div>
        <div class="value" id="stat-kappa">0%</div>
      </div>
      <div class="stat-chip">
        <div class="label">Main</div>
        <div class="value" id="stat-main">0/0</div>
      </div>
      <div class="stat-chip">
        <div class="label">Side</div>
        <div class="value" id="stat-side">0/0</div>
      </div>
      <div class="stat-chip">
        <div class="label">Hideout</div>
        <div class="value" id="stat-hideout">0%</div>
      </div>
    </div>
  </div>
  <div class="kappa-bar-wrap">
    <div class="kappa-bar-label">
      <span>&#9670; Kappa Container Progress</span>
      <span id="kappa-label-text">0 / 0 quests completed</span>
    </div>
    <div class="kappa-bar-track">
      <div class="kappa-bar-fill" id="kappa-bar" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('main')">
    &#9632; Main Story <span class="count-badge" id="tab-main-badge">0</span>
  </button>
  <button class="tab-btn" onclick="switchTab('side')">
    &#9632; Side Quests <span class="count-badge" id="tab-side-badge">0</span>
  </button>
  <button class="tab-btn" onclick="switchTab('hideout')">
    &#9632; Hideout <span class="count-badge" id="tab-hideout-badge">0</span>
  </button>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- MAIN STORY TAB -->
  <div class="tab-panel active" id="panel-main">
    <div class="filter-bar">
      <input type="text" class="search-input" placeholder="Search quests..." oninput="filterQuests('main', this.value)">
      <button class="filter-btn active" onclick="setFilter('main','all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('main','incomplete',this)">Incomplete</button>
      <button class="filter-btn" onclick="setFilter('main','complete',this)">Completed</button>
      <button class="reset-btn" onclick="resetTab('main')">Reset Tab</button>
    </div>
    <div class="section-bar-wrap">
      <div class="section-bar-label">
        <span>Main Story Progress</span>
        <span id="main-progress-text">0 / 0</span>
      </div>
      <div class="section-bar-track">
        <div class="section-bar-fill" id="main-bar" style="width:0%"></div>
      </div>
    </div>
    <div id="main-traders"></div>
  </div>

  <!-- SIDE QUESTS TAB -->
  <div class="tab-panel" id="panel-side">
    <div class="filter-bar">
      <input type="text" class="search-input" placeholder="Search quests..." oninput="filterQuests('side', this.value)">
      <button class="filter-btn active" onclick="setFilter('side','all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('side','incomplete',this)">Incomplete</button>
      <button class="filter-btn" onclick="setFilter('side','complete',this)">Completed</button>
      <button class="reset-btn" onclick="resetTab('side')">Reset Tab</button>
    </div>
    <div class="section-bar-wrap">
      <div class="section-bar-label">
        <span>Side Quest Progress</span>
        <span id="side-progress-text">0 / 0</span>
      </div>
      <div class="section-bar-track">
        <div class="section-bar-fill" id="side-bar" style="width:0%"></div>
      </div>
    </div>
    <div id="side-traders"></div>
  </div>

  <!-- HIDEOUT TAB -->
  <div class="tab-panel" id="panel-hideout">
    <div class="filter-bar">
      <input type="text" class="search-input" placeholder="Search items or stations..." oninput="filterHideout(this.value)">
      <button class="reset-btn" onclick="resetTab('hideout')">Reset Tab</button>
    </div>
    <div class="section-bar-wrap">
      <div class="section-bar-label">
        <span>Hideout Upgrade Items Gathered</span>
        <span id="hideout-progress-text">0 / 0</span>
      </div>
      <div class="section-bar-track">
        <div class="section-bar-fill" id="hideout-bar" style="width:0%"></div>
      </div>
    </div>
    <div class="hideout-grid" id="hideout-grid"></div>
  </div>

</div>

// ════════════════════════════════════════════════
//  STATE & STORAGE
// ════════════════════════════════════════════════
const KEY = 'tarkov_tracker_v2';
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : { quests: {}, hideout: {} };
  } catch { return { quests: {}, hideout: {} }; }
}
function saveState() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

// ════════════════════════════════════════════════
//  BUILD UI
// ════════════════════════════════════════════════

const activeTab = { current: 'main' };
const filters   = { main: 'all', side: 'all' };

function switchTab(tab) {
  activeTab.current = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const tabs = ['main','side','hideout'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + tab);
  });
}

function buildTraderSection(trader, quests, type) {
  const color = TRADERS[trader] || '#aaa';
  const done  = quests.filter(q => state.quests[q.id]).length;
  const total = quests.length;
  const pct   = total ? (done / total * 100) : 0;
  const collapsed = total > 0 && done === total ? ' collapsed' : '';

  const items = quests.map(q => {
    const checked = state.quests[q.id] ? 'checked' : '';
    return `<div class="quest-item${checked ? ' completed' : ''}" data-name="${q.name.toLowerCase()}" data-type="${type}" id="qi-${q.id}">
      <input type="checkbox" class="quest-checkbox" id="qc-${q.id}" ${checked} onchange="toggleQuest('${q.id}',this.checked)">
      <label class="quest-name" for="qc-${q.id}">${q.name}</label>
    </div>`;
  }).join('');

  return `<div class="trader-section${collapsed}" id="ts-${trader}-${type}">
    <div class="trader-header" onclick="toggleTrader('ts-${trader}-${type}')">
      <div class="trader-dot" style="background:${color}"></div>
      <span class="trader-name" style="color:${color}">${trader}</span>
      <div class="trader-mini-bar">
        <div class="trader-mini-fill" style="background:${color};width:${pct}%"></div>
      </div>
      <span class="trader-progress"><span class="done">${done}</span> / ${total}</span>
      <span class="trader-chevron">&#9660;</span>
    </div>
    <div class="quest-list">${items}</div>
  </div>`;
}

function buildQuestTab(type) {
  const kappa = type === 'main';
  const filtered = QUESTS.filter(q => q.kappa === kappa);
  const traders = [...new Set(filtered.map(q => q.trader))];
  const container = document.getElementById(type === 'main' ? 'main-traders' : 'side-traders');
  container.innerHTML = traders.map(t =>
    buildTraderSection(t, filtered.filter(q => q.trader === t), type)
  ).join('');
}

function buildHideout() {
  const grid = document.getElementById('hideout-grid');
  grid.innerHTML = HIDEOUT.map(station => {
    const allItems = station.levels.flatMap(l => l.items);
    const doneCt   = allItems.filter(i => state.hideout[i.id]).length;
    const totalCt  = allItems.length;

    const levelsHTML = station.levels.map(lv => {
      const lvDone  = lv.items.filter(i => state.hideout[i.id]).length;
      const lvTotal = lv.items.length;
      const lvComplete = lvDone === lvTotal ? ' level-complete' : '';
      const itemsHTML  = lv.items.map(item => {
        const checked = state.hideout[item.id] ? 'checked' : '';
        return `<div class="item-row${checked ? ' item-checked' : ''}" id="ir-${item.id}" data-name="${item.name.toLowerCase()}">
          <input type="checkbox" class="item-checkbox" id="ic-${item.id}" ${checked} onchange="toggleItem('${item.id}',this.checked)">
          <label class="item-name" for="ic-${item.id}">${item.name}</label>
          <span class="item-qty">×${item.qty}</span>
        </div>`;
      }).join('');
      return `<div class="station-level${lvComplete}" id="slv-${station.id}-${lv.level}">
        <div class="level-header">
          <span class="level-label">Level ${lv.level}</span>
          <span class="level-done-badge">&#10003; Complete</span>
        </div>
        <div class="item-list">${itemsHTML}</div>
      </div>`;
    }).join('');

    return `<div class="station-card" id="sc-${station.id}">
      <div class="station-header" onclick="toggleStation('sc-${station.id}')">
        <span class="station-icon">${station.icon}</span>
        <span class="station-name">${station.name}</span>
        <span class="station-progress-text">${doneCt}/${totalCt}</span>
        <span class="trader-chevron">&#9660;</span>
      </div>
      <div class="station-body">${levelsHTML}</div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════
//  TOGGLE HANDLERS
// ════════════════════════════════════════════════

function toggleQuest(id, checked) {
  state.quests[id] = checked;
  saveState();
  const el = document.getElementById('qi-' + id);
  if (el) el.classList.toggle('completed', checked);
  updateAll();
}

function toggleItem(id, checked) {
  state.hideout[id] = checked;
  saveState();
  const row = document.getElementById('ir-' + id);
  if (row) row.classList.toggle('item-checked', checked);
  checkLevelComplete(id);
  updateAll();
}

function checkLevelComplete(itemId) {
  for (const station of HIDEOUT) {
    for (const lv of station.levels) {
      if (lv.items.find(i => i.id === itemId)) {
        const done  = lv.items.filter(i => state.hideout[i.id]).length;
        const el = document.getElementById(`slv-${station.id}-${lv.level}`);
        if (el) el.classList.toggle('level-complete', done === lv.items.length);
      }
    }
  }
}

function toggleTrader(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('collapsed');
}
function toggleStation(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('collapsed');
}

// ════════════════════════════════════════════════
//  FILTER / SEARCH
// ════════════════════════════════════════════════

function filterQuests(type, query) {
  const q = query.toLowerCase().trim();
  const filter = filters[type];
  document.querySelectorAll(`.quest-item[data-type="${type}"]`).forEach(el => {
    const nameMatch = !q || el.dataset.name.includes(q);
    const isDone    = el.classList.contains('completed');
    const filterOk  = filter === 'all'
      || (filter === 'complete' && isDone)
      || (filter === 'incomplete' && !isDone);
    el.classList.toggle('hidden', !(nameMatch && filterOk));
  });
}

function filterHideout(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.item-row').forEach(el => {
    el.classList.toggle('hidden', q && !el.dataset.name.includes(q));
  });
}

function setFilter(type, filter, btn) {
  filters[type] = filter;
  btn.closest('.filter-bar').querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const searchInput = btn.closest('.filter-bar').querySelector('.search-input');
  filterQuests(type, searchInput ? searchInput.value : '');
}

// ════════════════════════════════════════════════
//  STATS & PROGRESS
// ════════════════════════════════════════════════

function updateAll() {
  const kappaQuests = QUESTS.filter(q => q.kappa);
  const kappaDone   = kappaQuests.filter(q => state.quests[q.id]).length;
  const kappaTotal  = kappaQuests.length;
  const kappaPct    = kappaTotal ? Math.round(kappaDone / kappaTotal * 100) : 0;

  const sideQuests  = QUESTS.filter(q => !q.kappa);
  const sideDone    = sideQuests.filter(q => state.quests[q.id]).length;
  const sideTotal   = sideQuests.length;

  const allItems    = HIDEOUT.flatMap(s => s.levels.flatMap(l => l.items));
  const hideDone    = allItems.filter(i => state.hideout[i.id]).length;
  const hideTotal   = allItems.length;
  const hidePct     = hideTotal ? Math.round(hideDone / hideTotal * 100) : 0;

  // Header stats
  document.getElementById('stat-kappa').textContent    = kappaPct + '%';
  document.getElementById('stat-main').textContent     = kappaDone + '/' + kappaTotal;
  document.getElementById('stat-side').textContent     = sideDone + '/' + sideTotal;
  document.getElementById('stat-hideout').textContent  = hidePct + '%';

  // Kappa bar
  document.getElementById('kappa-bar').style.width          = kappaPct + '%';
  document.getElementById('kappa-label-text').textContent   = kappaDone + ' / ' + kappaTotal + ' quests completed';

  // Main tab bar
  document.getElementById('main-bar').style.width           = (kappaTotal ? kappaDone/kappaTotal*100 : 0) + '%';
  document.getElementById('main-progress-text').textContent = kappaDone + ' / ' + kappaTotal;
  document.getElementById('tab-main-badge').textContent     = kappaDone + '/' + kappaTotal;

  // Side tab bar
  document.getElementById('side-bar').style.width           = (sideTotal ? sideDone/sideTotal*100 : 0) + '%';
  document.getElementById('side-progress-text').textContent = sideDone + ' / ' + sideTotal;
  document.getElementById('tab-side-badge').textContent     = sideDone + '/' + sideTotal;

  // Hideout tab bar
  document.getElementById('hideout-bar').style.width            = hidePct + '%';
  document.getElementById('hideout-progress-text').textContent  = hideDone + ' / ' + hideTotal;
  document.getElementById('tab-hideout-badge').textContent      = hidePct + '%';

  // Update trader mini bars
  ['main','side'].forEach(type => {
    const kappa2 = type === 'main';
    const filtered = QUESTS.filter(q => q.kappa === kappa2);
    const traders  = [...new Set(filtered.map(q => q.trader))];
    traders.forEach(tr => {
      const tquests = filtered.filter(q => q.trader === tr);
      const tdone   = tquests.filter(q => state.quests[q.id]).length;
      const ttotal  = tquests.length;
      const fill = document.querySelector(`#ts-${tr}-${type} .trader-mini-fill`);
      const prog = document.querySelector(`#ts-${tr}-${type} .trader-progress`);
      if (fill) fill.style.width = (ttotal ? tdone/ttotal*100 : 0) + '%';
      if (prog) prog.innerHTML   = `<span class="done">${tdone}</span> / ${ttotal}`;
    });
  });

  // Update hideout station progress text
  HIDEOUT.forEach(station => {
    const allI  = station.levels.flatMap(l => l.items);
    const doneI = allI.filter(i => state.hideout[i.id]).length;
    const el = document.querySelector(`#sc-${station.id} .station-progress-text`);
    if (el) el.textContent = doneI + '/' + allI.length;
  });
}

// ════════════════════════════════════════════════
//  RESET
// ════════════════════════════════════════════════

function resetTab(tab) {
  if (!confirm(`Reset all ${tab} progress? This cannot be undone.`)) return;
  if (tab === 'main') {
    QUESTS.filter(q => q.kappa).forEach(q => { delete state.quests[q.id]; });
    buildQuestTab('main');
  } else if (tab === 'side') {
    QUESTS.filter(q => !q.kappa).forEach(q => { delete state.quests[q.id]; });
    buildQuestTab('side');
  } else if (tab === 'hideout') {
    HIDEOUT.flatMap(s => s.levels.flatMap(l => l.items)).forEach(i => { delete state.hideout[i.id]; });
    buildHideout();
  }
  saveState();
  updateAll();
}

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════
buildQuestTab('main');
buildQuestTab('side');
buildHideout();
updateAll();
</script>
