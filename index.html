<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8a45c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarkov">
<link rel="manifest" href="manifest.json">

<title>Tarkov Tracker</title>
<style>
:root {
  --bg:          #0d0d0d;
  --surface:     #141414;
  --card:        #1c1c1c;
  --card2:       #222;
  --border:      #2a2a2a;
  --gold:        #c8a45c;
  --gold-dim:    #8a6f3a;
  --green:       #3d6e4e;
  --green-hi:    #6ab87f;
  --red:         #8b3a3a;
  --text:        #d4cfc8;
  --text-dim:    #7a756e;
  --text-muted:  #4a4540;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top:    env(safe-area-inset-top, 0px);
  --tab-h:       58px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', Courier, monospace;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: max(var(--safe-top), 10px) 16px 10px;
  flex-shrink: 0;
  z-index: 50;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-hex {
  width: 36px; height: 36px;
  clip-path: polygon(50% 0%,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);
  background: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 900; color: #0d0d0d;
  flex-shrink: 0;
}
.logo-text h1 {
  font-size: 16px; font-weight: bold;
  color: var(--gold); letter-spacing: 3px; text-transform: uppercase;
}
.logo-text p {
  font-size: 9px; color: var(--text-muted);
  letter-spacing: 2px; text-transform: uppercase;
}
.header-chips {
  display: flex; gap: 10px; align-items: center;
}
.chip {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4px 8px;
  text-align: center;
}
.chip .lbl { font-size: 8px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
.chip .val { font-size: 14px; font-weight: bold; color: var(--gold); }

/* ── KAPPA BAR ── */
.kappa-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 8px 12px;
}
.kappa-lbl {
  display: flex; justify-content: space-between;
  font-size: 9px; color: var(--text-dim);
  letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 5px;
}
.kappa-lbl b { color: var(--gold); }
.kappa-track {
  height: 7px; background: #080808;
  border-radius: 2px; overflow: hidden;
  border: 1px solid var(--border);
}
.kappa-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius: 2px;
  transition: width .4s ease;
  position: relative; overflow: hidden;
}
.kappa-fill::after {
  content: '';
  position: absolute; top:0; right:0; bottom:0; width:30px;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,.15));
}

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + 8px);
}

/* ── BOTTOM TAB BAR ── */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
}
.tab-btn {
  flex: 1;
  background: none; border: none;
  color: var(--text-muted);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px;
  cursor: pointer;
  font-family: inherit;
  transition: color .15s;
  padding: 6px 4px 2px;
  position: relative;
}
.tab-btn.active { color: var(--gold); }
.tab-btn.active::before {
  content: '';
  position: absolute; top: 0; left: 20%; right: 20%;
  height: 2px; background: var(--gold); border-radius: 0 0 2px 2px;
}
.tab-icon { font-size: 20px; line-height: 1; }
.tab-label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
.tab-badge {
  position: absolute; top: 4px; right: calc(50% - 18px);
  background: var(--gold-dim); color: #0d0d0d;
  font-size: 8px; font-weight: bold;
  border-radius: 3px; padding: 1px 3px;
  line-height: 1.2;
}

/* ── TAB PANELS ── */
.panel { display: none; padding: 12px; }
.panel.active { display: block; }

/* ── SECTION PROGRESS ── */
.sec-bar-wrap { margin-bottom: 14px; }
.sec-bar-lbl {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 1px; margin-bottom: 4px;
}
.sec-track {
  height: 4px; background: var(--border);
  border-radius: 2px; overflow: hidden;
}
.sec-fill {
  height: 100%; background: var(--green-hi);
  border-radius: 2px; transition: width .3s;
}

/* ── FILTER BAR ── */
.filter-bar {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 12px; align-items: center;
}
.search-input {
  flex: 1; min-width: 140px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); padding: 10px 12px;
  font-family: inherit; font-size: 13px;
  border-radius: 4px; outline: none;
  -webkit-appearance: none;
}
.search-input:focus { border-color: var(--gold-dim); }
.search-input::placeholder { color: var(--text-muted); }
.f-btn {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text-dim); padding: 9px 12px;
  font-family: inherit; font-size: 10px;
  letter-spacing: 1px; text-transform: uppercase;
  cursor: pointer; border-radius: 4px;
  transition: all .15s; white-space: nowrap;
  min-height: 40px;
}
.f-btn.active, .f-btn:active { border-color: var(--gold-dim); color: var(--gold); }
.reset-btn {
  background: none; border: 1px solid var(--red);
  color: var(--red); padding: 9px 12px;
  font-family: inherit; font-size: 10px;
  letter-spacing: 1px; text-transform: uppercase;
  cursor: pointer; border-radius: 4px;
  min-height: 40px; margin-left: auto;
}

/* ── TRADER SECTION ── */
.trader-section {
  margin-bottom: 8px;
  border: 1px solid var(--border);
  border-radius: 4px; overflow: hidden;
}
.trader-hdr {
  display: flex; align-items: center;
  padding: 12px 14px; cursor: pointer;
  background: var(--card); gap: 10px;
  min-height: 52px; user-select: none;
}
.trader-hdr:active { background: var(--card2); }
.trader-dot {
  width: 10px; height: 10px;
  border-radius: 50%; flex-shrink: 0;
}
.trader-name {
  flex: 1; font-size: 12px;
  letter-spacing: 2px; text-transform: uppercase;
  font-weight: bold;
}
.trader-prog { font-size: 11px; color: var(--text-dim); }
.trader-prog .done { color: var(--green-hi); }
.mini-bar {
  width: 50px; height: 3px;
  background: var(--border); border-radius: 2px; overflow: hidden;
}
.mini-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.chevron {
  color: var(--text-muted); font-size: 11px;
  transition: transform .2s; flex-shrink: 0;
}
.trader-section.collapsed .chevron { transform: rotate(-90deg); }
.quest-list { border-top: 1px solid var(--border); }
.trader-section.collapsed .quest-list { display: none; }

/* ── QUEST ITEM ── */
.q-item {
  display: flex; align-items: center;
  padding: 12px 14px 12px 22px;
  border-bottom: 1px solid #1a1a1a;
  gap: 12px; min-height: 48px;
  transition: background .1s;
}
.q-item:last-child { border-bottom: none; }
.q-item:active { background: #1a1a1a; }
.q-item.done { opacity: .45; }
.q-item.done .q-name { text-decoration: line-through; }
.q-item.hidden { display: none; }
.q-check {
  width: 22px; height: 22px; flex-shrink: 0;
  border: 1.5px solid var(--border);
  background: var(--bg); border-radius: 3px;
  cursor: pointer; appearance: none; -webkit-appearance: none;
  position: relative; transition: all .15s;
}
.q-check:checked {
  background: var(--green); border-color: var(--green-hi);
}
.q-check:checked::after {
  content: '✓'; position: absolute;
  top: -1px; left: 2px;
  font-size: 15px; color: var(--green-hi);
}
.q-name { flex: 1; font-size: 13px; line-height: 1.3; }

/* ── HIDEOUT GRID ── */
.hideout-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.station-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px; overflow: hidden;
}
.station-hdr {
  padding: 12px 14px; background: var(--card2);
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; min-height: 52px; user-select: none;
}
.station-hdr:active { background: #2a2a2a; }
.station-icon { font-size: 20px; }
.station-name {
  flex: 1; font-size: 12px;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--gold);
}
.station-body { border-top: 1px solid var(--border); }
.station-card.collapsed .station-body { display: none; }
.station-lv {
  border-bottom: 1px solid #1a1a1a;
  padding: 10px 14px;
}
.station-lv:last-child { border-bottom: none; }
.lv-hdr {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.lv-label {
  font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text-dim);
}
.lv-done {
  font-size: 9px; background: var(--green);
  color: var(--green-hi); padding: 1px 6px;
  border-radius: 2px; display: none;
}
.station-lv.lv-complete .lv-done { display: inline; }
.item-list { display: flex; flex-direction: column; gap: 2px; }
.item-row {
  display: flex; align-items: center;
  gap: 10px; padding: 8px 0;
  border-bottom: 1px solid #1a1a1a; min-height: 44px;
}
.item-row:last-child { border-bottom: none; }
.item-chk {
  width: 20px; height: 20px; flex-shrink: 0;
  border: 1.5px solid var(--border);
  background: var(--bg); border-radius: 3px;
  cursor: pointer; appearance: none; -webkit-appearance: none;
  position: relative; transition: all .15s;
}
.item-chk:checked { background: var(--gold-dim); border-color: var(--gold); }
.item-chk:checked::after {
  content: '✓'; position: absolute;
  top: -1px; left: 1px;
  font-size: 14px; color: var(--gold);
}
.item-name { flex: 1; font-size: 12px; line-height: 1.3; }
.item-row.item-done .item-name { text-decoration: line-through; color: var(--text-muted); }
.item-qty { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.item-row.hidden { display: none; }
</style>
</head>

<!-- HEADER -->
<div class="header">

    </div>
    <div class="header-chips">

        <div class="lbl">Kappa</div>
        <div class="val" id="stat-kappa">0%</div>
      </div>
      <div class="chip">
        <div class="lbl">Hideout</div>
        <div class="val" id="stat-hideout">0%</div>
      </div>
    </div>
  </div>
  <div class="kappa-wrap">
    <div class="kappa-lbl">
      <b>&#9670; KAPPA CONTAINER</b>
      <span id="kappa-txt">0 / 0</span>
    </div>
    <div class="kappa-track">
      <div class="kappa-fill" id="kappa-fill" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- SCROLL AREA -->
<div class="scroll-area">

  <!-- MAIN STORY PANEL -->
  <div class="panel active" id="panel-main">
    <div class="filter-bar">
      <input type="text" class="search-input" placeholder="Search quests…" oninput="filterQ('main',this.value)">
      <button class="f-btn active" onclick="setF('main','all',this)">All</button>
      <button class="f-btn" onclick="setF('main','todo',this)">To Do</button>
      <button class="f-btn" onclick="setF('main','done',this)">Done</button>
      <button class="reset-btn" onclick="resetTab('main')">Reset</button>
    </div>
    <div class="sec-bar-wrap">
      <div class="sec-bar-lbl">
        <span>Main Story</span>
        <span id="main-txt">0 / 0</span>
      </div>
      <div class="sec-track"><div class="sec-fill" id="main-fill" style="width:0%"></div></div>
    </div>
    <div id="main-list"></div>
  </div>

  <!-- SIDE QUESTS PANEL -->
  <div class="panel" id="panel-side">
    <div class="filter-bar">
      <input type="text" class="search-input" placeholder="Search quests…" oninput="filterQ('side',this.value)">
      <button class="f-btn active" onclick="setF('side','all',this)">All</button>
      <button class="f-btn" onclick="setF('side','todo',this)">To Do</button>
      <button class="f-btn" onclick="setF('side','done',this)">Done</button>
      <button class="reset-btn" onclick="resetTab('side')">Reset</button>
    </div>
    <div class="sec-bar-wrap">
      <div class="sec-bar-lbl">
        <span>Side Quests</span>
        <span id="side-txt">0 / 0</span>
      </div>
      <div class="sec-track"><div class="sec-fill" id="side-fill" style="width:0%"></div></div>
    </div>
    <div id="side-list"></div>
  </div>

  <!-- HIDEOUT PANEL -->
  <div class="panel" id="panel-hideout">
    <div class="filter-bar">
      <input type="text" class="search-input" placeholder="Search items or stations…" oninput="filterH(this.value)">
      <button class="reset-btn" onclick="resetTab('hideout')">Reset</button>
    </div>
    <div class="sec-bar-wrap">
      <div class="sec-bar-lbl">
        <span>Hideout Items</span>
        <span id="hide-txt">0 / 0</span>
      </div>
      <div class="sec-track"><div class="sec-fill" id="hide-fill" style="width:0%"></div></div>
    </div>
    <div class="hideout-grid" id="hide-grid"></div>
  </div>

</div>

<!-- BOTTOM TAB BAR -->
<nav class="tab-bar">
  <button class="tab-btn active" id="tbtn-main" onclick="switchTab('main')">
    <span class="tab-icon">&#9632;</span>
    <span class="tab-label">Main</span>
    <span class="tab-badge" id="badge-main"></span>
  </button>
  <button class="tab-btn" id="tbtn-side" onclick="switchTab('side')">
    <span class="tab-icon">&#9671;</span>
    <span class="tab-label">Side</span>
    <span class="tab-badge" id="badge-side"></span>
  </button>
  <button class="tab-btn" id="tbtn-hideout" onclick="switchTab('hideout')">
    <span class="tab-icon">&#8962;</span>
    <span class="tab-label">Hideout</span>
    <span class="tab-badge" id="badge-hide"></span>
  </button>
</nav>

const KEY = 'tarkov_v3';
let S = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {q:{},h:{}}; } catch { return {q:{},h:{}}; } })();
const save = () => localStorage.setItem(KEY, JSON.stringify(S));

// ═══════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════
let curTab = 'main';
function switchTab(tab) {
  curTab = tab;
  ['main','side','hideout'].forEach(t => {
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
    document.getElementById('tbtn-'+t).classList.toggle('active', t===tab);
  });
}

// ═══════════════════════════════════════
//  BUILD
// ═══════════════════════════════════════
function buildQuests(type) {
  const kappa = type === 'main';
  const qs = QUESTS.filter(q => q.kappa === kappa);
  const traders = [...new Set(qs.map(q => q.trader))];
  return traders.map(tr => {
    const tqs = qs.filter(q => q.trader === tr);
    const color = TRADERS[tr] || '#aaa';
    const done = tqs.filter(q => S.q[q.id]).length;
    const total = tqs.length;
    const pct = total ? done/total*100 : 0;
    const rows = tqs.map(q => {
      const chk = S.q[q.id] ? 'checked' : '';
      return `<div class="q-item${chk?' done':''}" id="qi${q.id}" data-type="${type}" data-name="${q.name.toLowerCase()}">
        <input type="checkbox" class="q-check" id="qc${q.id}" ${chk} onchange="toggleQ('${q.id}',this.checked)">
        <label class="q-name" for="qc${q.id}">${q.name}</label>
      </div>`;
    }).join('');
    return `<div class="trader-section" id="ts${tr}${type}">
      <div class="trader-hdr" onclick="toggleTrader('ts${tr}${type}')">
        <div class="trader-dot" style="background:${color}"></div>
        <span class="trader-name" style="color:${color}">${tr}</span>
        <div class="mini-bar"><div class="mini-fill" id="mf${tr}${type}" style="background:${color};width:${pct}%"></div></div>
        <span class="trader-prog" id="tp${tr}${type}"><span class="done">${done}</span>/${total}</span>
        <span class="chevron">&#9660;</span>
      </div>
      <div class="quest-list">${rows}</div>
    </div>`;
  }).join('');
}

function buildHideout() {
  return HIDEOUT.map(st => {
    const allI = st.levels.flatMap(l => l.items);
    const done = allI.filter(i => S.h[i.id]).length;
    const lvls = st.levels.map(lv => {
      const lvDone = lv.items.filter(i => S.h[i.id]).length;
      const complete = lvDone === lv.items.length ? ' lv-complete' : '';
      const rows = lv.items.map(it => `<div class="item-row${S.h[it.id]?' item-done':''}" id="ir${it.id}" data-name="${it.name.toLowerCase()}">
        <input type="checkbox" class="item-chk" id="ic${it.id}" ${S.h[it.id]?'checked':''} onchange="toggleItem('${it.id}',this.checked)">
        <label class="item-name" for="ic${it.id}">${it.name}</label>
        <span class="item-qty">×${it.qty}</span>
      </div>`).join('');
      return `<div class="station-lv${complete}" id="slv${st.id}${lv.level}">
        <div class="lv-hdr"><span class="lv-label">Level ${lv.level}</span><span class="lv-done">&#10003; Done</span></div>
        <div class="item-list">${rows}</div>
      </div>`;
    }).join('');
    return `<div class="station-card" id="sc${st.id}">
      <div class="station-hdr" onclick="toggleStation('sc${st.id}')">
        <span class="station-icon">${st.icon}</span>
        <span class="station-name">${st.name}</span>
        <span style="font-size:11px;color:var(--text-dim)" id="stp${st.id}">${done}/${allI.length}</span>
        <span class="chevron">&#9660;</span>
      </div>
      <div class="station-body">${lvls}</div>
    </div>`;
  }).join('');
}

//  TOGGLE HANDLERS
// ═══════════════════════════════════════
function toggleQ(id, val) {
  S.q[id] = val; save();
  const el = document.getElementById('qi'+id);
  if (el) el.classList.toggle('done', val);
  updateStats();
}

function toggleItem(id, val) {
  S.h[id] = val; save();
  const row = document.getElementById('ir'+id);
  if (row) row.classList.toggle('item-done', val);
  for (const st of HIDEOUT) for (const lv of st.levels) {
    if (lv.items.find(i => i.id === id)) {
      const done = lv.items.filter(i => S.h[i.id]).length;
      const el = document.getElementById(`slv${st.id}${lv.level}`);
      if (el) el.classList.toggle('lv-complete', done === lv.items.length);
    }
  }
  updateStats();
}

function toggleTrader(id) { document.getElementById(id)?.classList.toggle('collapsed'); }
function toggleStation(id) { document.getElementById(id)?.classList.toggle('collapsed'); }

// ═══════════════════════════════════════
//  FILTER / SEARCH
// ═══════════════════════════════════════
const activeFilters = { main:'all', side:'all' };

function filterQ(type, q) {
  const query = q.toLowerCase().trim();
  const f = activeFilters[type];
  document.querySelectorAll(`.q-item[data-type="${type}"]`).forEach(el => {
    const nameOk = !query || el.dataset.name.includes(query);
    const isDone = el.classList.contains('done');
    const fOk = f==='all' || (f==='done'&&isDone) || (f==='todo'&&!isDone);
    el.classList.toggle('hidden', !(nameOk && fOk));
  });
}

function filterH(q) {
  const query = q.toLowerCase().trim();
  document.querySelectorAll('.item-row').forEach(el => {
    el.classList.toggle('hidden', !!query && !el.dataset.name.includes(query));
  });
}

function setF(type, f, btn) {
  activeFilters[type] = f;
  btn.closest('.filter-bar').querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const inp = btn.closest('.filter-bar').querySelector('.search-input');
  filterQ(type, inp ? inp.value : '');
}

// ═══════════════════════════════════════
//  RESET
// ═══════════════════════════════════════
function resetTab(tab) {
  if (!confirm(`Reset all ${tab} progress?`)) return;
  if (tab === 'main') {
    QUESTS.filter(q=>q.kappa).forEach(q => delete S.q[q.id]);
    document.getElementById('main-list').innerHTML = buildQuests('main');
  } else if (tab === 'side') {
    QUESTS.filter(q=>!q.kappa).forEach(q => delete S.q[q.id]);
    document.getElementById('side-list').innerHTML = buildQuests('side');
  } else {
    HIDEOUT.flatMap(s=>s.levels.flatMap(l=>l.items)).forEach(i => delete S.h[i.id]);
    document.getElementById('hide-grid').innerHTML = buildHideout();
  }
  save(); updateStats();
}

// ═══════════════════════════════════════
//  STATS
// ═══════════════════════════════════════
function updateStats() {
  const kQ = QUESTS.filter(q=>q.kappa);
  const kD = kQ.filter(q=>S.q[q.id]).length;
  const kT = kQ.length;
  const kPct = kT ? Math.round(kD/kT*100) : 0;

  const sQ = QUESTS.filter(q=>!q.kappa);
  const sD = sQ.filter(q=>S.q[q.id]).length;
  const sT = sQ.length;

  const allI = HIDEOUT.flatMap(s=>s.levels.flatMap(l=>l.items));
  const hD = allI.filter(i=>S.h[i.id]).length;
  const hT = allI.length;
  const hPct = hT ? Math.round(hD/hT*100) : 0;

  document.getElementById('stat-kappa').textContent   = kPct+'%';
  document.getElementById('stat-hideout').textContent = hPct+'%';
  document.getElementById('kappa-fill').style.width   = kPct+'%';
  document.getElementById('kappa-txt').textContent    = kD+' / '+kT;

  document.getElementById('main-fill').style.width  = (kT?kD/kT*100:0)+'%';
  document.getElementById('main-txt').textContent   = kD+' / '+kT;
  document.getElementById('side-fill').style.width  = (sT?sD/sT*100:0)+'%';
  document.getElementById('side-txt').textContent   = sD+' / '+sT;
  document.getElementById('hide-fill').style.width  = (hT?hD/hT*100:0)+'%';
  document.getElementById('hide-txt').textContent   = hD+' / '+hT;

  // Badges
  const bMain = document.getElementById('badge-main');
  const bSide = document.getElementById('badge-side');
  const bHide = document.getElementById('badge-hide');
  bMain.textContent = kD+'/'+kT; bMain.style.display = 'block';
  bSide.textContent = sD+'/'+sT; bSide.style.display = 'block';
  bHide.textContent = hPct+'%';  bHide.style.display = 'block';

  // Trader mini bars
  ['main','side'].forEach(type => {
    const kappa2 = type==='main';
    QUESTS.filter(q=>q.kappa===kappa2).reduce((acc,q)=>{
      (acc[q.trader]=acc[q.trader]||[]).push(q); return acc;
    },{});
    const traders = [...new Set(QUESTS.filter(q=>q.kappa===kappa2).map(q=>q.trader))];
    traders.forEach(tr => {
      const tqs = QUESTS.filter(q=>q.kappa===kappa2&&q.trader===tr);
      const td = tqs.filter(q=>S.q[q.id]).length;
      const tt = tqs.length;
      const fill = document.getElementById('mf'+tr+type);
      const prog = document.getElementById('tp'+tr+type);
      if (fill) fill.style.width = (tt?td/tt*100:0)+'%';
      if (prog) prog.innerHTML = `<span class="done">${td}</span>/${tt}`;
    });
  });

  // Hideout station text
  HIDEOUT.forEach(st => {
    const allI2 = st.levels.flatMap(l=>l.items);
    const done = allI2.filter(i=>S.h[i.id]).length;
    const el = document.getElementById('stp'+st.id);
    if (el) el.textContent = done+'/'+allI2.length;
  });
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
document.getElementById('main-list').innerHTML = buildQuests('main');
document.getElementById('side-list').innerHTML = buildQuests('side');
document.getElementById('hide-grid').innerHTML = buildHideout();
updateStats();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
