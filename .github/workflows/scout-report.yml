name: Claude Scout weekly report

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m claude_scout --no-cache report -o reports/latest.md
      - name: Commit if changed
        run: |
          git config user.name "claude-scout[bot]"
          git config user.email "claude-scout@users.noreply.github.com"
          git add reports/latest.md
          git diff --cached --quiet || git commit -m "Update Claude Scout report" && git push
