name: Claude Scout weekly report

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m claude_scout --no-cache report -o reports/latest.md
      - name: Commit if changed
        run: |
          git config user.name "claude-scout[bot]"
          git config user.email "claude-scout@users.noreply.github.com"
          git add reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Update Claude Scout report"
            git push
          fi
